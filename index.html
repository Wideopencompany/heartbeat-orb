<style>
  html, body { margin:0; padding:0; background:#04050a; overflow:hidden; height:100%; }

  #orb-canvas:active { cursor:grabbing; }
  #palettes {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);

  }
  .prow { display:flex; gap:10px; }
  .swatch {
    width:28px; height:28px; border-radius:50%; cursor:pointer;
    border:2px solid rgba(255,255,255,0.15); box-sizing:border-box;
    transition:transform .15s, border-color .15s;
  }
  .swatch:hover { transform:scale(1.2); }
  .swatch.active { border-color:rgba(255,255,255,0.9); transform:scale(1.15); }
  #spalettes {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    display:none; gap:10px; z-index:10;
  }
  #tabs { position:fixed; top:16px; left:16px; z-index:10; display:flex; gap:6px; }
  #tabs button {
    padding:6px 14px; cursor:pointer; font:10.5px ui-monospace, Menlo, monospace;

  #panel {
    position:fixed; top:16px; right:16px; z-index:10; width:215px;

    border:1px solid rgba(255,255,255,0.08); border-radius:10px;

  }
  #panel .row { display:flex; flex-wrap:wrap; align-items:center; margin:8px 0; row-gap:3px; }
  #panel label { flex:1; text-transform:uppercase; letter-spacing:.05em; font-size:9.5px; }
  #panel input[type=range] { flex:0 0 100%; width:100%; accent-color:#5ad8c8; height:3px; }

  #panel button {
    width:100%; margin-top:8px; padding:6px 0; cursor:pointer;
    background:rgba(90,216,200,0.12); color:#5ad8c8;

  #panel .bbtn {

  }
  #panel .bbtn:hover { background:rgba(255,255,255,0.12); }

  #panel #micbtn { grid-column:1 / -1; }
  #panel #micbtn.live { background:rgba(255,80,80,0.2); color:#ff8a7a; border-color:rgba(255,90,80,0.55); }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------- constants
const N_CELLS = 16;
const BPM = 52;
const PERIOD = 60 / BPM;
const GAP = 0.022;
const KAPPA = 0.055;
const R_IN = 0.10;

let seed = 9;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// -------------------------------------------------------------- palettes
// Built on color-harmony rules: every lobe sits in one perceptual
// lightness/chroma band (cohesion), hues run analogous with a single
// complementary accent (interest), the hero is the deepest anchor, and the
// core glow is an in-family hue so transmitted light never clashes.
const PALETTES = [
  { name: 'Bioluminescence', bg: 0x04050a, hero: 0x2747ee,
    lobes: [0x3f6dff, 0x35e0c8, 0x4fd877, 0xd84fd8, 0x8a5fff, 0x38b6ff, 0x57e0a8, 0xc94fa8],
    coreDeep: 0x041029, coreGlow: 0x12616b, lights: [0x33ddff, 0xdd44ff, 0x44ffaa] },
  { name: 'Aurora', bg: 0x030a08, hero: 0x0bbf7d,
    lobes: [0x19e8a0, 0x3ff2c8, 0x69f0d8, 0x22c97d, 0x7d5ce8, 0xe86ad8, 0x3fd8f2, 0x9ff07a],
    coreDeep: 0x02180f, coreGlow: 0x18a06a, lights: [0x3fffc0, 0xa06aff, 0xe070ff] },
  { name: 'Nebula', bg: 0x070310, hero: 0x5a2fe8,
    lobes: [0x7a4ff5, 0xb54fe8, 0xe055c0, 0xff6f9e, 0x5a6af8, 0xc97aff, 0x8a3fd8, 0xf05a88],
    coreDeep: 0x10042a, coreGlow: 0x6a35a0, lights: [0xa050ff, 0xff5aa0, 0x5a7aff] },
  { name: 'Ember', bg: 0x0a0504, hero: 0xee3d22,
    lobes: [0xff8c3f, 0xffb347, 0xff6b5e, 0xe8434f, 0xffd24f, 0xff7a8a, 0xe8702a, 0xffaa6a],
    coreDeep: 0x200603, coreGlow: 0xa04010, lights: [0xffaa40, 0xff5040, 0xffd060] },
  { name: 'Glacier', bg: 0x03060c, hero: 0x2a5fd8,
    lobes: [0x6ab8f5, 0x8fd8ff, 0x4f8fe8, 0x7fe8e8, 0xa8c8ff, 0x5fd0f0, 0x3a78d8, 0x9fe8ff],
    coreDeep: 0x051430, coreGlow: 0x2a7ab0, lights: [0x7ad0ff, 0xa0e8ff, 0xcfe8ff] },
  { name: 'Orchid', bg: 0x08040a, hero: 0xb82fd8,
    lobes: [0xe060b0, 0xa85ff0, 0xff7ac8, 0x7a5af0, 0xd84f8a, 0xc070ff, 0xf060d8, 0x8f6af8],
    coreDeep: 0x1a0520, coreGlow: 0x8a2a78, lights: [0xff60c0, 0xa060ff, 0xff90e0] },
];

// gradient palettes: 8 lobe colors sampled along a smooth hue ramp (HSL
// interpolation keeps chroma alive through the middle instead of going gray)
function grad8(stops) {
  const cols = stops.map(s => new THREE.Color(s));
  const out = [];
  for (let i = 0; i < 8; i++) {
    const t = (i / 7) * (cols.length - 1);
    const a = Math.min(Math.floor(t), cols.length - 2);
    out.push(cols[a].clone().lerpHSL(cols[a + 1], t - a).getHex());
  }
  return out;
}
PALETTES.push(
  { name: 'Acid', bg: 0x060a02, hero: 0x1ed400,           // neon green x orange
    lobes: grad8(['#39ff14', '#ffe600', '#ff7a00']),
    coreDeep: 0x0a2002, coreGlow: 0x6ab012, lights: [0x66ff33, 0xffaa33, 0xccff33] },
  { name: 'Sunset', bg: 0x0a0406, hero: 0xe8175a,
    lobes: grad8(['#ff2e88', '#ff6f3f', '#ffc24f']),
    coreDeep: 0x240408, coreGlow: 0xa03028, lights: [0xff5a90, 0xff9040, 0xffd060] },
  { name: 'Lagoon', bg: 0x02080c, hero: 0x0f5fe8,
    lobes: grad8(['#1f8fff', '#18e0c0', '#7dff9f']),
    coreDeep: 0x031428, coreGlow: 0x1a7a8a, lights: [0x40a0ff, 0x40ffd0, 0x90ffb0] },
  { name: 'Dream', bg: 0x05060e, hero: 0x2a35f5,        // from the reference image
    lobes: grad8(['#00e0f0', '#2a35f5', '#a04ff0', '#f060c0', '#ffa216']),
    coreDeep: 0x0a1030, coreGlow: 0x3a7ab0, lights: [0x00e0f0, 0xa04ff0, 0xffa216] }
);

// the five colors of the reference gradient image -- drive the GRAD CORE
const GRAD_COLORS = ['#00e0f0', '#ffa216', '#2a35f5', '#a04ff0', '#f060c0']
  .map(c => new THREE.Color(c));

// monochromatic palettes: one hue per palette, pieces varied only in
// lightness/saturation -- tonal variations like the Ember favourite
function monoPalette(name, hex) {
  const hsl = {}; new THREE.Color(hex).getHSL(hsl);
  const mk = (l, s) => new THREE.Color().setHSL(hsl.h, s ?? hsl.s, l).getHex();
  return {
    name, bg: mk(0.025, hsl.s * 0.5), hero: mk(0.30, 1.0),
    lobes: [mk(0.50), mk(0.42), mk(0.58), mk(0.38), mk(0.54), mk(0.46), mk(0.62), mk(0.40)],
    coreDeep: mk(0.08), coreGlow: mk(0.28), lights: [mk(0.60), mk(0.50), mk(0.72)],
  };
}
const MONO = [
  monoPalette('Mono Ember',   '#ff5a28'),
  monoPalette('Mono Gold',    '#ffb300'),
  monoPalette('Mono Lime',    '#9ee82a'),
  monoPalette('Mono Emerald', '#16d06a'),
  monoPalette('Mono Cyan',    '#19d3e6'),
  monoPalette('Mono Azure',   '#2a6bff'),
  monoPalette('Mono Violet',  '#8a4bff'),
  monoPalette('Mono Magenta', '#ff3fae'),
];
const ALL_PALETTES = [...PALETTES, ...MONO];

// ------------------------------------------------------------ cell centers
const centers = [];
{
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N_CELLS; i++) {
    const y = 1 - (i / (N_CELLS - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const th = ga * i;
    const v = new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r);
    v.x += (rnd() - 0.5) * 0.22; v.y += (rnd() - 0.5) * 0.22; v.z += (rnd() - 0.5) * 0.22;
    v.normalize();
    centers.push(v);
  }
}
let hero = 0; {
  let bd = 1e9; const target = new THREE.Vector3(-0.35, 0.05, 0.95).normalize();
  centers.forEach((c, i) => { const d = c.distanceTo(target); if (d < bd) { bd = d; hero = i; } });
}
const weights = centers.map((_, i) => (i === hero ? 0.20 : 0));

// contraction wave: wider spread so the spasm visibly starts on one side
// and ripples across the orb
const apex = new THREE.Vector3(-0.5, 0.6, 0.62).normalize();
const delays = centers.map(c => (1 - c.dot(apex)) * 0.5 * 0.55);

// neighbour graph -> springs push/pull each other = soft-body collisions
const neighbors = centers.map((c, i) =>
  centers.map((d, j) => j).filter(j => j !== i && centers[i].angleTo(centers[j]) < 1.0)
);

// ------------------------------------------------------------ spring state
const cellX = new Float32Array(N_CELLS), cellV = new Float32Array(N_CELLS);
let globalX = 0, globalV = 0;

function heartForce(s) {
  const g = (t, c, w) => Math.exp(-((t - c) * (t - c)) / (w * w));
  return 1.00 * g(s, 0.00, 0.040) + 0.55 * g(s, 0.165, 0.050);
}

// ------------------------------------------------------------------ scene
const canvas = document.getElementById('orb-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(PALETTES[0].bg);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 50);
camera.position.set(0, 0, 4.4);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 2.2;
controls.maxDistance = 42;   // zoom all the way out to icon size
controls.rotateSpeed = 0.6;

const orb = new THREE.Group();
scene.add(orb);

// ----------------------------------------------- pillow-lobe geometry
const _nj = new THREE.Vector3(), _dir = new THREE.Vector3(), _P = new THREE.Vector3();

function makeLobeGeometry(i, rOut, lat) {
  const ci = centers[i];
  const up = Math.abs(ci.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  const T1 = new THREE.Vector3().crossVectors(ci, up).normalize();
  const T2 = new THREE.Vector3().crossVectors(ci, T1);

  const geo = new THREE.SphereGeometry(1, 56, 40);
  const pos = geo.attributes.position;

  for (let v = 0; v < pos.count; v++) {
    const ux = pos.getX(v), uy = pos.getY(v), uz = pos.getZ(v);
    const h = (uz + 1) / 2;
    const taper = 0.16 + 0.84 * Math.pow(h, 1.25);
    const along = R_IN + (rOut - R_IN) * h;

    _P.copy(ci).multiplyScalar(along)
      .addScaledVector(T1, ux * lat * taper)
      .addScaledVector(T2, uy * lat * taper);

    for (let j = 0; j < N_CELLS; j++) {
      if (j === i || centers[j].angleTo(ci) > 1.7) continue;
      _nj.subVectors(centers[j], ci).normalize();
      const r = _P.length();
      _dir.copy(_P).divideScalar(r);
      const e = _dir.dot(_nj) + GAP - (weights[i] - weights[j]) * 0.5;
      if (e > -0.3) {
        const sm = KAPPA * Math.log(1 + Math.exp(e / KAPPA));
        _P.addScaledVector(_nj, -sm * r);
      }
    }

    const r2 = _P.length();
    const x = r2 / rOut;
    const rNew = rOut * x / Math.pow(1 + Math.pow(x, 9), 1 / 9);
    _P.multiplyScalar(rNew / r2);

    pos.setXYZ(v, _P.x, _P.y, _P.z);
  }
  geo.computeVertexNormals();
  return geo;
}

// --------------------------------------------------------------- materials
const lobes = [];
const sharedT = { value: 0 }, sharedGlob = { value: 0 };
const lobeU = [];

for (let i = 0; i < N_CELLS; i++) {
  const rOut = (i === hero ? 1.05 : 0.95 + rnd() * 0.09);
  const lat = 0.95 * (0.9 + rnd() * 0.2);

  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,              // tinted by applyPalette below
    metalness: 0,
    roughness: 0.42,
    transmission: 1.0,
    thickness: 0.55,
    ior: 1.38,
    attenuationDistance: 1.5,
    iridescence: 1.0,
    iridescenceIOR: 1.32,
    iridescenceThicknessRange: [120, 420],
    clearcoat: 0.6,
    clearcoatRoughness: 0.28,
    emissiveIntensity: 0.04,
    envMapIntensity: 0.42,
  });

  // soft-body deformation injected into the physical material's vertex shader
  const u = { beat: { value: 0 }, vel: { value: 0 } };
  lobeU.push(u);
  const axis = centers[i].clone();
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uAxis = { value: axis };
    shader.uniforms.uBeat = u.beat;
    shader.uniforms.uVel  = u.vel;
    shader.uniforms.uGlob = sharedGlob;
    shader.uniforms.uT    = sharedT;
    shader.vertexShader = `
      uniform vec3 uAxis; uniform float uBeat; uniform float uVel;
      uniform float uGlob; uniform float uT;
    ` + shader.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      {
        float along = dot(transformed, uAxis);
        vec3 lateral = transformed - uAxis * along;
        float h = smoothstep(0.12, 1.0, along);
        // big systole: cap extrudes far and the pillow widens hard into its
        // neighbours -- pieces visibly press and bounce off each other
        float pump = (uBeat + uGlob * 0.5) * h;
        transformed += uAxis * pump * 0.34;
        transformed += lateral * pump * 0.75;
        // jelly ripple driven by spring velocity
        float wob = uVel * 0.030 * sin(along * 9.0 - uT * 13.0);
        transformed += lateral * wob * h;
      }
    `);
  };

  const lobe = new THREE.Mesh(makeLobeGeometry(i, rOut, lat), mat);
  orb.add(lobe);
  lobes.push(lobe);
}

// ------------------------------------------- glowing heart deep inside
const heartU = {
  uTime: { value: 0 }, uBeat: { value: 0 }, uMode: { value: 0 },
  uDeep: { value: new THREE.Color(PALETTES[0].coreDeep) },
  uGlow: { value: new THREE.Color(PALETTES[0].coreGlow) },
  uGradCols: { value: GRAD_COLORS.map(c => c.clone().convertSRGBToLinear()) },
};
const heartGlow = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.55, 4),
  new THREE.ShaderMaterial({
    uniforms: heartU,
    vertexShader: /* glsl */`
      uniform float uTime; uniform float uBeat;
      varying vec3 vN; varying vec3 vP; varying vec3 vD;
      float h(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }
      float n3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
        return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x), mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x), mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y), f.z); }
      void main(){
        vec3 p = normalize(position);
        float lump = n3(p*3.5 + uTime*0.08) * 0.10 + uBeat * 0.10;
        vec3 q = p * 0.55 * (1.0 + lump);
        vD = p; vN = normalMatrix * p; vP = (modelViewMatrix * vec4(q,1.0)).xyz;
        gl_Position = projectionMatrix * vec4(vP, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform float uTime; uniform float uBeat; uniform float uMode;
      uniform vec3 uDeep; uniform vec3 uGlow;
      uniform vec3 uGradCols[5];
      varying vec3 vN; varying vec3 vP; varying vec3 vD;
      float h(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }
      float n3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
        return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x), mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x), mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y), f.z); }
      void main(){
        vec3 n = normalize(vN), v = normalize(-vP);
        float fres = pow(1.0 - max(dot(n,v),0.0), 1.4);
        float murk = n3(vD*4.5 + uTime*0.12);
        vec3 col = mix(uDeep, uGlow, fres) + murk * uGlow * 0.35;
        if (uMode > 0.5) {
          // moving gradient: five colored light-blobs drifting on slow,
          // incommensurate orbits, blended like the reference image
          float T = uTime * 0.6;
          vec3 d0 = normalize(vec3(sin(T*0.21),      cos(T*0.17),      sin(T*0.13+1.7)));
          vec3 d1 = normalize(vec3(cos(T*0.15+2.0),  sin(T*0.19+0.6),  cos(T*0.11)));
          vec3 d2 = normalize(vec3(sin(T*0.12+4.0),  sin(T*0.16+2.5),  cos(T*0.18+1.0)));
          vec3 d3 = normalize(vec3(cos(T*0.17+1.2),  cos(T*0.13+3.1),  sin(T*0.15+0.4)));
          vec3 d4 = normalize(vec3(sin(T*0.19+5.1),  cos(T*0.21+1.9),  sin(T*0.14+2.8)));
          float w0 = pow(max(dot(vD,d0),0.0)*0.5+0.5, 4.0);
          float w1 = pow(max(dot(vD,d1),0.0)*0.5+0.5, 4.0);
          float w2 = pow(max(dot(vD,d2),0.0)*0.5+0.5, 4.0);
          float w3 = pow(max(dot(vD,d3),0.0)*0.5+0.5, 4.0);
          float w4 = pow(max(dot(vD,d4),0.0)*0.5+0.5, 4.0);
          vec3 acc = uGradCols[0]*w0 + uGradCols[1]*w1 + uGradCols[2]*w2
                   + uGradCols[3]*w3 + uGradCols[4]*w4;
          col = acc / (w0+w1+w2+w3+w4) * (0.50 + murk*0.25);
        }
        col *= 1.0 + uBeat * 2.2;
        gl_FragColor = vec4(col, 1.0);
      }`,
  })
);
orb.add(heartGlow);

const innerLights = [
  new THREE.PointLight(0xffffff, 5.0, 4, 1.8),
  new THREE.PointLight(0xffffff, 3.6, 4, 1.8),
  new THREE.PointLight(0xffffff, 3.0, 4, 1.8),
];
innerLights[0].position.set(-0.2, 0.22, 0.25);
innerLights[1].position.set(0.25, -0.15, -0.15);
innerLights[2].position.set(0.05, -0.25, 0.28);
innerLights.forEach(l => orb.add(l));

// ------------------------------------------------------- ambient particles
let particlesMat, ambientPts;
{
  const n = 220, pos = new Float32Array(n * 3);
  for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 14;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  particlesMat = new THREE.PointsMaterial({

    uniforms: {
      uScatter: { value: SW.scatter },
      uGloss: { value: 0.9 },
      uStyle: { value: 0 },
      uL: { value: new THREE.Vector3(0.55, 0.7, 0.45).normalize() },
      uL2: { value: new THREE.Vector3(-0.6, 0.35, -0.25).normalize() },
      uBg: { value: SWARM_BG_LIN },
    },
    vertexShader: /* glsl */`
      varying vec3 vN; varying vec3 vV; varying vec3 vC;
      void main(){
        vN = normalize(normalMatrix * mat3(instanceMatrix) * normal);
        vC = instanceColor;
        vec4 mv = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
        vV = -mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform float uScatter; uniform float uGloss; uniform float uStyle;
      uniform vec3 uL; uniform vec3 uL2; uniform vec3 uBg;
      varying vec3 vN; varying vec3 vV; varying vec3 vC;
      void main(){
        vec3 n = normalize(vN), v = normalize(vV);
        vec3 col;
        if (uStyle < 0.5) {
          // WAX: fake subsurface -- wrapped diffuse, sky bleeding through
          // the rim, light passing through backlit beads -- plus fresnel-
          // boosted glossy specular from two lights (blue-marble reference)
          float wrap = clamp((dot(n, uL) + 0.6) / 1.6, 0.0, 1.0);
          float rim  = pow(1.0 - max(dot(n, v), 0.0), 2.2);
          float thru = pow(max(dot(-v, uL), 0.0), 3.0);
          col = vC * (0.34 + 0.78 * wrap * wrap);
          col += vC * uScatter * (rim * 0.45 * uBg + thru * 0.55);
          vec3 H = normalize(uL + v), H2 = normalize(uL2 + v);
          float fres = 0.4 + 0.6 * pow(1.0 - max(dot(n, v), 0.0), 3.0);
          float spec = pow(max(dot(n, H), 0.0), 140.0) * 1.3
                     + pow(max(dot(n, H), 0.0), 24.0) * 0.22
                     + pow(max(dot(n, H2), 0.0), 90.0) * 0.5;
          col += uGloss * spec * fres;
        } else {
          // graphic styles: no light response at all -- flat ink in the
          // palette colors, with one printed-on specular dot sitting where
          // the wax key light would ping
          float edge = max(dot(n, v), 0.0);
          float dotSpec = smoothstep(0.960, 0.972, dot(n, normalize(uL + v)));
          if (uStyle < 1.5) {        // TOON: three hard cel bands
            float d = clamp((dot(n, uL) + 0.6) / 1.6, 0.0, 1.0);

            col = vC * band;

            col = vC;

            col = mix(vC * 0.16, vC, smoothstep(0.26, 0.36, edge));
          }
          col = mix(col, vec3(1.0), dotSpec * clamp(uGloss, 0.0, 1.0));
        }

function swarmSim(dt, t) {
  const f = SW.scale, f2 = f * 2.7, T = t * SW.speed;
  const amp = SW.flow * 0.22, spin = SW.spin;
  const arr = swarm.instanceMatrix.array;
  for (let i = 0; i < SW.count; i++) {
    const b = i * 3;
    let x = swarmPos[b], y = swarmPos[b + 1], z = swarmPos[b + 2];
    // trig flow: each velocity component ignores its own axis, so the field
    // is divergence-free -- beads slide in sheets instead of clumping
    let vx = Math.sin(f * y + T)       + Math.cos(f * z + T * 0.7) + 0.5 * Math.sin(f2 * y - T * 1.4);
    let vy = Math.sin(f * z + T * 0.9) + Math.cos(f * x + T * 0.6) + 0.5 * Math.sin(f2 * z - T * 1.2);
    let vz = Math.sin(f * x + T * 0.8) + Math.cos(f * y + T * 1.1) + 0.5 * Math.sin(f2 * x - T * 1.5);
    // global orbit around Y + soft spring to each bead's own shell radius
    const r = Math.sqrt(x * x + y * y + z * z) || 1e-6;
    const k = ((SW.shell + swarmOff[i] * SW.spread) - r) * 3.0 / r;
    vx = vx * amp + spin * z + x * k;
    vy = vy * amp + y * k;
    vz = vz * amp - spin * x + z * k;
    x += vx * dt; y += vy * dt; z += vz * dt;
    swarmPos[b] = x; swarmPos[b + 1] = y; swarmPos[b + 2] = z;
    const m = i * 16, s = 0.011 * SW.size * swarmScl[i];
    arr[m] = s; arr[m + 5] = s; arr[m + 10] = s;
    arr[m + 12] = x; arr[m + 13] = y; arr[m + 14] = z; arr[m + 15] = 1;
  }
  swarm.count = SW.count;
  swarm.instanceMatrix.needsUpdate = true;
}

// animated film grain, weighted into the shadows for an organic finish
const GrainShader = {
  uniforms: {
    tDiffuse: { value: null }, uTime: { value: 0 },
    uAmount: { value: 0.055 }, uContrast: { value: 1.0 },
    uBg: { value: new THREE.Color(PALETTES[0].bg).convertSRGBToLinear() },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uAmount;
    uniform float uContrast; uniform vec3 uBg;
    varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      // object mask: how far this pixel is from the background color, so
      // grading touches only the orb, never the backdrop
      float objMask = smoothstep(0.008, 0.06, distance(c.rgb, uBg));
      // contrast pivots at the BACKGROUND color -> bg pixels stay identical
      c.rgb = mix(c.rgb, (c.rgb - uBg) * uContrast + uBg, objMask);
      float g = h(vUv * 1234.5 + mod(uTime, 10.0) * 61.7);
      float luma = dot(c.rgb, vec3(0.299, 0.587, 0.114));
      c.rgb += (g - 0.5) * uAmount * (1.0 - luma * 0.55) * objMask;
      gl_FragColor = c;
    }`,
};
const grainPass = new ShaderPass(GrainShader);
composer.addPass(grainPass);
window.__grain = grainPass;

    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    await ac.resume();
    micAnalyser = ac.createAnalyser();
    micAnalyser.fftSize = 1024;
    micAnalyser.smoothingTimeConstant = 0.55;
    ac.createMediaStreamSource(micStream).connect(micAnalyser);
    micBuf = new Uint8Array(micAnalyser.frequencyBinCount);
    micOn = true;
    micBtn.textContent = '🎤 LIVE';
    micBtn.classList.add('live');
  } catch (e) {
    micBtn.textContent = 'MIC ✗';
    setTimeout(() => { micBtn.textContent = '🎤 MIC'; }, 1500);
  }
}

function applySettings() {
  for (const l of lobes) {
    l.material.transmission = S.transparency;
    l.material.ior = S.refraction;
  }
  bloomPass.strength = 0.38 * S.glow;
  grainPass.uniforms.uAmount.value = S.grain;
  grainPass.uniforms.uContrast.value = S.contrast;
}

function settingsText() {
  return [
    'ORB SETTINGS',
    `behavior: ${behavior}`,
    `palette: ${activePalette.name}`,
    ...SLIDERS.map(s => `${s.key}: ${s.fmt(S[s.key])}`),
    `gradcore: ${S.gradcore ? 'on' : 'off'}`,
  ].join('\n');
}

const ctl = {};   // slider input/readout refs, so behaviours can drive the UI
const behaviorBtns = {};
let gradCb, micBtn, paneOrb, paneSwarm;
{
  const panel = document.getElementById('panel');
  paneOrb = document.createElement('div');
  paneSwarm = document.createElement('div');

  const grid = document.createElement('div'); grid.className = 'bgrid';
  for (const [key, B] of Object.entries(BEHAVIORS)) {

    grid.appendChild(b);
  }
  micBtn = document.createElement('button');
  micBtn.className = 'bbtn'; micBtn.id = 'micbtn'; micBtn.textContent = '🎤 MIC';
  micBtn.onclick = toggleMic;
  grid.appendChild(micBtn);
  paneOrb.appendChild(grid);

  SLIDERS.forEach(cfg => {
    const row = document.createElement('div'); row.className = 'row';

    const val = document.createElement('span'); val.className = 'val'; val.textContent = cfg.fmt(S[cfg.key]);
    // manual drag pins target = value, so the behaviour tween won't fight it
    inp.oninput = () => { S[cfg.key] = targetS[cfg.key] = parseFloat(inp.value); val.textContent = cfg.fmt(S[cfg.key]); applySettings(); };
    ctl[cfg.key] = { inp, val, fmt: cfg.fmt };
    row.append(lab, val, inp);   // label + number on top, full-width slider below
    paneOrb.appendChild(row);
  });
  // gradient-core toggle: moving multicolor light inside the orb

  const tlab = document.createElement('label'); tlab.textContent = 'Grad core';
  gradCb = document.createElement('input'); gradCb.type = 'checkbox';
  gradCb.onchange = () => { S.gradcore = gradCb.checked; heartU.uMode.value = gradCb.checked ? 1 : 0; };
  trow.append(tlab, gradCb);
  paneOrb.appendChild(trow);

  const btn = document.createElement('button');
  btn.textContent = 'COPY SETTINGS';
  btn.onclick = async () => {
    const txt = settingsText();

    catch { window.prompt('Copy settings:', txt.replace(/\n/g, ' | ')); }
    setTimeout(() => { btn.textContent = 'COPY SETTINGS'; }, 1200);
  };
  paneOrb.appendChild(btn);

  const rbtn = document.createElement('button');
  rbtn.textContent = 'RESET';
  rbtn.onclick = () => { resetView(); setBehavior('idle', true); };
  paneOrb.appendChild(rbtn);
}

// -------------------------------------------------- swarm tab controls
const SWARM_SLIDERS = [
  { key: 'count',   label: 'Count',   min: 500, max: MAX_SWARM, step: 100, fmt: v => v.toFixed(0) },
  { key: 'size',    label: 'Size',    min: 0.3, max: 3,    step: 0.01,  fmt: v => v.toFixed(2) },
  { key: 'flow',    label: 'Flow',    min: 0,   max: 3,    step: 0.01,  fmt: v => v.toFixed(2) },
  { key: 'scale',   label: 'Scale',   min: 0.4, max: 6,    step: 0.01,  fmt: v => v.toFixed(2) },
  { key: 'speed',   label: 'Speed',   min: 0,   max: 3,    step: 0.01,  fmt: v => v.toFixed(2) },
  { key: 'spin',    label: 'Spin',    min: 0,   max: 2,    step: 0.01,  fmt: v => v.toFixed(2) },
  { key: 'shell',   label: 'Shell',   min: 0.6, max: 1.8,  step: 0.01,  fmt: v => v.toFixed(2) },
  { key: 'spread',  label: 'Spread',  min: 0,   max: 0.6,  step: 0.005, fmt: v => v.toFixed(3) },
  { key: 'scatter', label: 'Scatter', min: 0,   max: 2,    step: 0.01,  fmt: v => v.toFixed(2) },
  { key: 'gloss',   label: 'Gloss',   min: 0,   max: 2,    step: 0.01,  fmt: v => v.toFixed(2) },
];
const SWARM_STYLES = ['WAX', 'TOON', 'POP', 'INK'];
const sctl = {};        // swarm slider refs, so RESET can drive the UI
let swarmStyleBtns = [];
{
  // shading style row: WAX is the lit wax look, the rest are pure graphic
  const srow = document.createElement('div');
  srow.className = 'bgrid';
  srow.style.gridTemplateColumns = 'repeat(4,1fr)';
  swarmStyleBtns = SWARM_STYLES.map((name, i) => {
    const b = document.createElement('button');
    b.className = 'bbtn' + (i === 0 ? ' active' : '');
    b.textContent = name;
    b.onclick = () => {
      swarm.material.uniforms.uStyle.value = i;
      swarmStyleBtns.forEach((x, j) => x.classList.toggle('active', j === i));
    };

  SWARM_SLIDERS.forEach(cfg => {
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label'); lab.textContent = cfg.label;
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = cfg.min; inp.max = cfg.max; inp.step = cfg.step; inp.value = SW[cfg.key];
    const val = document.createElement('span'); val.className = 'val'; val.textContent = cfg.fmt(SW[cfg.key]);
    inp.oninput = () => {
      SW[cfg.key] = parseFloat(inp.value);
      val.textContent = cfg.fmt(SW[cfg.key]);
      if (cfg.key === 'scatter') swarm.material.uniforms.uScatter.value = SW.scatter;
      if (cfg.key === 'gloss')   swarm.material.uniforms.uGloss.value = SW.gloss;
    };
    sctl[cfg.key] = { inp, val, fmt: cfg.fmt };
    row.append(lab, val, inp);
    paneSwarm.appendChild(row);
  });
  const btn = document.createElement('button');
  btn.textContent = 'COPY SETTINGS';
  btn.onclick = async () => {
    const txt = ['SWARM SETTINGS',
      `style: ${SWARM_STYLES[swarm.material.uniforms.uStyle.value]}`,
      `palette: ${activeSwarmPalette.name}`,
      ...SWARM_SLIDERS.map(s => `${s.key}: ${s.fmt(SW[s.key])}`)].join('\n');
    try { await navigator.clipboard.writeText(txt); btn.textContent = 'COPIED ✓'; }
    catch { window.prompt('Copy settings:', txt.replace(/\n/g, ' | ')); }
    setTimeout(() => { btn.textContent = 'COPY SETTINGS'; }, 1200);
  };
  paneSwarm.appendChild(btn);

  const rbtn = document.createElement('button');
  rbtn.textContent = 'RESET';
  rbtn.onclick = () => {
    resetView();
    Object.assign(SW, SW_DEFAULTS);
    swarm.material.uniforms.uScatter.value = SW.scatter;
    swarm.material.uniforms.uGloss.value = SW.gloss;
    swarm.material.uniforms.uStyle.value = 0;
    swarmStyleBtns.forEach((b, i) => b.classList.toggle('active', i === 0));
    setSwarmPalette(SWARM_PALETTES[0]);
    for (const k in sctl) { sctl[k].inp.value = SW[k]; sctl[k].val.textContent = sctl[k].fmt(SW[k]); }
  };
  paneSwarm.appendChild(rbtn);
}

// shared by both RESET buttons: bring the camera home
function resetView() {
  camera.position.set(0, 0, 4.4);
  controls.target.set(0, 0, 0);
}

// ------------------------------------------------------------ mode tabs
let mode = 'orb';
const tabBtns = {};
function setMode(m) {
  mode = m;
  orb.visible = ambientPts.visible = m === 'orb';
  swarm.visible = m === 'swarm';
  paneOrb.style.display = m === 'orb' ? '' : 'none';
  paneSwarm.style.display = m === 'swarm' ? '' : 'none';
  document.getElementById('palettes').style.display = m === 'orb' ? '' : 'none';
  document.getElementById('spalettes').style.display = m === 'swarm' ? 'flex' : 'none';
  for (const [k, b] of Object.entries(tabBtns)) b.classList.toggle('active', k === m);
}
{
  const tabs = document.getElementById('tabs');
  for (const [key, label] of [['orb', 'ORB'], ['swarm', 'SWARM']]) {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => setMode(key);
    tabBtns[key] = b;
    tabs.appendChild(b);
  }
  // swarm palette swatches: poster background ringing the ink colors
  const spal = document.getElementById('spalettes');
  for (const p of SWARM_PALETTES) {

    el.className = 'swatch';
    el.title = p.name;
    el.style.background =
      `radial-gradient(circle at 35% 35%, ${p.cols[0]} 0%, ${p.cols[0]} 38%, ${p.bg} 46%, ${p.bg} 100%)`;
    el.onclick = () => setSwarmPalette(p);
    sswatchEls[p.name] = el;
    spal.appendChild(el);
  }
  sswatchEls[activeSwarmPalette.name].classList.add('active');
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ------------------------------------------------------------------- loop
const clock = new THREE.Clock();
let beatT = 0, rotY = 0, rotPhase = 0;

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 1 / 30);
  const t = clock.elapsedTime;

  // ease sliders + behaviour params toward their targets (~1s glide)
  const ease = 1 - Math.exp(-dt * 2.5);
  let moving = false;
  for (const cfg of SLIDERS) {
    const k = cfg.key, d = targetS[k] - S[k];
    if (Math.abs(d) > 1e-4) { S[k] += d * ease; moving = true; }
  }
  if (moving) { syncSliderUI(); applySettings(); }
  tw.bpm += (tgt.bpm - tw.bpm) * ease;
  tw.rot += (tgt.rot - tw.rot) * ease;
  tw.breathe += (tgt.breathe - tw.breathe) * ease;

  beatT = (beatT + dt) % (60 / tw.bpm);

  // THINK: drift the monochrome palette around the hue wheel
  if (hueCycleOn) {
    hueT = (hueT + dt * 0.05) % 1;
    palTarget = paletteTargets(monoHuePalette(hueT));
  }

  // CYCLE: every few seconds a new color is born on the left side and its
  // front sweeps across the orb, taking over piece by piece; the core,
  // lights and background flip as the front crosses the middle
  if (colorWaveOn) {
    waveClock += dt;
    if (waveClock >= WAVE_PERIOD && !wave) {
      waveClock = 0;
      waveHue = (waveHue + 0.14) % 1;
      wave = { pal: paletteTargets(monoHuePalette(waveHue)), t: 0,
               done: new Array(N_CELLS).fill(false), coreDone: false };
      orbitT = 0;   // fling the protons with every new color
    }
    if (wave) {
      wave.t += dt;
      const front = -1.25 + 2.5 * (wave.t / WAVE_SWEEP);
      for (let i = 0; i < N_CELLS; i++) {
        if (wave.done[i]) continue;
        _wq.copy(centers[i]).applyQuaternion(orb.quaternion);
        if (_wq.x <= front) {
          wave.done[i] = true;
          palTarget.tints[i].copy(wave.pal.tints[i]);
          sweepFlash[i] = 1;
        }
      }
      if (!wave.coreDone && front >= 0) {
        wave.coreDone = true;
        palTarget.coreDeep.copy(wave.pal.coreDeep);
        palTarget.coreGlow.copy(wave.pal.coreGlow);
        wave.pal.lights.forEach((c, i) => palTarget.lights[i].copy(c));
        palTarget.bg.copy(wave.pal.bg);
      }
      if (wave.t >= WAVE_SWEEP) wave = null;
    }
  }
  // claimed pieces snap over fast in wave mode so the front edge stays crisp
  lerpPalette(Math.min(1, dt * (colorWaveOn ? 7 : 4)));

  // microphone level above its own running average -> force on the springs
  let audio = 0;
  if (micOn && micAnalyser) {
    micAnalyser.getByteFrequencyData(micBuf);
    let sum = 0; const n = micBuf.length >> 1;
    for (let i = 0; i < n; i++) sum += micBuf[i];
    const lvl = sum / n / 255;
    audioLvl += (lvl - audioLvl) * Math.min(1, dt * 16);
    audioAvg += (audioLvl - audioAvg) * Math.min(1, dt * 1.0);
    audio = Math.max(0, audioLvl * 2.4 - audioAvg * 1.4);
  }
  const beatScale = micOn ? 0.35 : 1;   // sound takes over from the heartbeat

  globalV += (-120 * globalX - 9.0 * globalV
              + heartForce(beatT) * 16.0 * S.spasm * beatScale
              + audio * 70 * Math.max(S.spasm, 0.8)) * dt;
  globalX += globalV * dt;

  for (let i = 0; i < N_CELLS; i++) {
    // collision coupling: inflated neighbours shove this piece's spring,
    // so the spasm visibly transfers from piece to piece
    let shove = 0;
    for (const j of neighbors[i]) shove += cellX[j] - cellX[i];
    cellV[i] += (-85 * cellX[i] - 5.5 * cellV[i]
                 + heartForce(beatT - delays[i]) * 17.0 * S.spasm * beatScale
                 + audio * (45 + 20 * Math.sin(i * 2.7))
                 + shove * 10.0) * dt;
    cellX[i] += cellV[i] * dt;

    lobeU[i].beat.value = cellX[i] + 0.015 * Math.sin(t * 1.6 + i * 13.7);
    lobeU[i].vel.value = cellV[i];
    sweepFlash[i] = Math.max(0, sweepFlash[i] - dt * 2.2);   // takeover flash fades
    lobes[i].material.emissiveIntensity =
      (0.04 + Math.max(cellX[i], 0) * 0.9 + sweepFlash[i] * 0.55) * S.glow;
  }
  sharedT.value = t;
  sharedGlob.value = globalX;

  const flare = Math.max(globalX, 0) + audio * 0.6;
  heartU.uTime.value = t;
  heartU.uBeat.value = flare;
  heartGlow.scale.setScalar(1 + flare * 0.35);
  innerLights.forEach((l, i) => {
    l.intensity = [5.0, 3.6, 3.0][i] * (1 + flare * 2.5) * S.glow;
    if (S.gradcore) {
      // cycle the inner lights through the gradient colors, offset per light
      const u = (t * 0.10 + i * 1.67) % GRAD_COLORS.length;
      const a = Math.floor(u), f = u - a;
      l.color.copy(GRAD_COLORS[a]).lerp(GRAD_COLORS[(a + 1) % GRAD_COLORS.length], f);
    }
  });

  grainPass.uniforms.uTime.value = t;

  // proton orbiters
  // CYCLE: each color wave flings the orbits out (1 -> 3, quick) and then
  // they ease gently back toward the center before the next wave
  orbitT += dt;
  if (colorWaveOn) {
    const att = Math.min(orbitT / 0.35, 1);                    // quick fling out
    const rel = Math.exp(-Math.max(orbitT - 0.35, 0) * 1.1);   // slow ease home
    orbitK = 1 + 2 * (att * att * (3 - 2 * att)) * rel;
  } else {
    orbitK = S.porbit;
  }
  for (let i = 0; i < MAX_PROTONS; i++) {
    const m = protons[i], d = m.userData;
    m.visible = mode === 'orb' && i < S.protons;
    if (!m.visible) continue;
    d.th += dt * d.speed * S.pspeed;
    const r = d.rBase * orbitK;
    m.position.set(0, 0, 0)
      .addScaledVector(d.A, Math.cos(d.th) * r * d.ecc)
      .addScaledVector(d.B, Math.sin(d.th) * r);
    m.scale.setScalar(S.psize);
  }

  // rotation accumulates so behaviour speed changes don't snap the pose
  rotY += dt * 0.16 * tw.rot;
  rotPhase += dt * tw.rot;
  orb.rotation.y = rotY;
  orb.rotation.x = Math.sin(rotPhase * 0.13) * 0.18;
  orb.rotation.z = Math.cos(rotPhase * 0.09) * 0.08;
  orb.scale.setScalar(1 + tw.breathe * Math.sin(t * 0.7));   // SLEEPY breathing

  if (mode === 'swarm') {
    swarmSim(dt, t);
    // light-teal daylight backdrop; gentler bloom so the beads stay matte
    scene.background.copy(SWARM_BG);
    grainPass.uniforms.uBg.value.copy(SWARM_BG_LIN);
    bloomPass.strength = 0.10;
  } else {
    bloomPass.strength = 0.38 * S.glow;
  }

  controls.update();
  composer.render();
}
setBehavior('idle', true);   // idle IS the default on load
setMode('orb');
window.__orb = { lobes, centers, orb, palTarget, palCur, swarm, SW, setMode, swarmPos,
  get mode() { return mode; },
  get behavior() { return behavior; },
  get waveState() { return { colorWaveOn, waveClock, waveHue, orbitT, orbitK, wave: wave && { t: wave.t, done: wave.done.filter(Boolean).length } }; } };
tick();
</script>
